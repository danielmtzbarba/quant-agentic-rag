#trigger
name: CI (Research Service Image)

on:
  push:
    branches: [dev, prod]
    paths:
      - ".github/workflows/ci-images.yml"
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "uv.lock"
      - "src/**"
      - "tests/**"
      - "data/evaluation/**"
      - "README.md"
  pull_request:
    branches: ["**"]
    paths:
      - ".github/workflows/ci-images.yml"
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "uv.lock"
      - "src/**"
      - "tests/**"
      - "data/evaluation/**"
      - "README.md"

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE_NAME: research_service

jobs:
  context:
    name: Resolve Build Context
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      should_push: ${{ steps.meta.outputs.should_push }}
    steps:
      - name: Compute Tags
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_REF: ${{ github.head_ref }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
        run: |
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            BRANCH_NAME="${HEAD_REF}"
            SHOULD_PUSH="false"
          else
            BRANCH_NAME="${REF_NAME}"
            SHOULD_PUSH="true"
          fi

          SAFE_BRANCH="$(printf '%s' "${BRANCH_NAME}" | tr '[:upper:]' '[:lower:]')"
          SHORT_SHA="${GITHUB_SHA_VALUE}"
          echo "image_tag=${SAFE_BRANCH}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "should_push=${SHOULD_PUSH}" >> "$GITHUB_OUTPUT"

  qa:
    name: Lint, Format, Test
    needs: [context]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install Dependencies
        run: uv sync --dev

      - name: Run Ruff (Linting)
        run: uv run ruff check src tests

      - name: Run Ruff (Formatting Check)
        run: uv run ruff format --check src tests

      - name: Run Tests (Pytest)
        run: uv run pytest

  build-image:
    name: Build Research Service Image
    needs: [context, qa]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: needs.context.outputs.should_push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Research Service Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ needs.context.outputs.should_push == 'true' }}
          tags: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ needs.context.outputs.image_tag }}
          cache-from: type=gha,scope=research_service
          cache-to: type=gha,mode=max,scope=research_service
